# ============================================================================
# Welcome screen art
# ============================================================================
#
# Edit and open a new shell (or run `welcome`) to see changes. To try a look
# without editing this file:
#
#   welcome-art --scheme classic --glyphs blocks --glyph-mode depth
#   welcome-art --animation ripple --duration 1.5
#   welcome-art --list          # everything available
#
# Comments must be on their own line (# is also used for colors).
#
# Colors are hex (#8fd3ff) or terminal colors: black red green yellow blue
# magenta cyan white, bright-<name>, or default. Terminal colors follow your
# terminal theme; hex colors look the same everywhere.

[art]
# lakes, classic, ice, mono, any
# [scheme.<name>] you add below, "random" (see [random]) or "auto" (see [auto])
scheme = classic

# A set from [glyphs] below, or literal characters (e.g. "•●")
glyphs = dots

# How glyphs from the set are used:
#   uniform  every dot uses the first glyph
#   random   each dot picks one at random
#   depth    shoreline uses the first glyph, open water the last
#   lake     each lake gets its own glyph
glyph_mode = uniform

# Chance any dot sparkles (0 turns glints off)
glints = 0.03
glint_color = #ebf8ff

# Space-separated places to pin, or none. See `welcome-art --list`, or add
# your own under [places].
pins = chicago
pin_glyph = ⬤
pin_color = #4ade80

[animation]
# none, fill (shore to open water), sweep (west to east), ripple (out from
# the first pin), rain (random), shimmer (sparkles that settle), or random.
# Press any key (or Ctrl-C) to skip.
style = rain
# Seconds
duration = 0.7
# always, daily (first shell of the day), or never
when = always

[auto]
# Scheme per season when scheme = auto
winter = ice
spring = lakes
summer = lakes
fall = classic

[random]
# Schemes to pick from when scheme = random
pool = lakes classic ice mono

[glyphs]
# Each glyph must be one terminal column wide
dots = •
blocks = ░ ▒ ▓ █

[places]
# Extra pins as row,col on the map (row 0-25 from the top, col 0-99 from the left)
# home = 21,55

# ----------------------------------------------------------------------------
# Color schemes
# ----------------------------------------------------------------------------
#
# Three types:
#
#   depth     each lake fades from its shoreline color to its open-water
#             color. Keys: superior michigan huron erie ontario, or `all`
#             for every lake. Each takes "shore open-water" (or more stops).
#   gradient  one ramp across the whole map. Keys: stops, and direction
#             (west-east, north-south, depth, radial from the first pin).
#             Gradient depth is relative to each lake's deepest point.
#   random    each dot picks a color from `colors` (repeat one to weight it).
#
# `jitter` (default 0.25) adds a little per-dot variation to depth/gradient.

[scheme.lakes]
type = depth
superior = #8fd3ff #1f4fbf
michigan = #7fe0e8 #1769aa
huron = #8be9d6 #1a7f9e
erie = #a7f0c0 #2a8f86
ontario = #9ec9ff #3b5bd6

# The original look: random terminal colors, about 3 in 8 left plain
[scheme.classic]
type = random
colors = blue yellow red magenta cyan default default default

# Winter: ice along the shore, dark steel water beyond
[scheme.ice]
type = gradient
direction = depth
stops = #f4f9ff #b6d2e8 #5f87aa #2f5677

[scheme.mono]
type = depth
all = #c9d1d9 #4b5563
jitter = 0.15
