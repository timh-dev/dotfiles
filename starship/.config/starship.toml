# Starship Prompt Configuration
# Material Theme High Contrast Colors

format = """
[┌─](bold #C3E88D)$os$sudo$username$shell$directory$git_branch$git_status$jobs$memory_usage$battery [$time](bold #FFCB6B)
[│](bold #C3E88D) $package$python$nodejs$rust$golang$terraform$docker_context$aws$cmd_duration$status
[└─](bold #C3E88D)$character"""

[character]
success_symbol = "[➜](bold #C3E88D)"
error_symbol = "[✗](bold #FF5370)"

[sudo]
style = "bold #FF5370"
symbol = "🧙 "
format = "[$symbol]($style)"
disabled = true

[os]
format = "[$symbol]($style) "
style = "bold #FFFFFF"
disabled = false

[os.symbols]
Macos = ""
Ubuntu = ""
Windows = ""
Linux = ""

[username]
style_user = "bold #82AAFF"
style_root = "bold #FF5370"
format = "🐟 [$user]($style) "
show_always = true

[hostname]
ssh_only = true
format = "on [$hostname](bold #FFCB6B) "

[shell]
zsh_indicator = "🐚"
bash_indicator = "🐚"
fish_indicator = "🐟"
powershell_indicator = "💻"
format = "[$indicator]($style) "
style = "bold #89DDFF"
disabled = true

[directory]
truncation_length = 3
truncate_to_repo = true
format = "in [$path]($style)[$read_only]($read_only_style) "
style = "bold #82AAFF"

[git_branch]
symbol = " "
format = "on [$symbol$branch]($style) "
style = "bold #C792EA"

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold #F07178"
conflicted = "🏳"
ahead = "⇡${count}"
behind = "⇣${behind_count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "\\$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

[python]
symbol = "🐍 "
format = 'via [$symbol$pyenv_prefix($version )(\($virtualenv\) )]($style)'
style = "#FFCB6B"
pyenv_version_name = false

[nodejs]
symbol = "🐚 "
format = "via [$symbol($version )]($style)"
style = "bold #C3E88D"
detect_files = ["package.json", ".node-version", "tsconfig.json"]
detect_folders = ["node_modules"]

[package]
symbol = "📦 "
format = "[$symbol$version]($style) "
style = "bold #F78C6C"
disabled = false

[rust]
symbol = "🦀 "
format = "via [$symbol($version )]($style)"
style = "bold #F07178"

[golang]
symbol = "🐹 "
format = "via [$symbol($version )]($style)"
style = "bold #89DDFF"

[terraform]
symbol = "💠 "
format = "via [$symbol$workspace]($style) "
style = "bold #C792EA"

[docker_context]
symbol = "🐳 "
format = "via [$symbol$context]($style) "
style = "bold #82AAFF"

[aws]
symbol = "☁️  "
format = 'on [$symbol($profile )(\($region\) )]($style)'
style = "bold #FFCB6B"

[cmd_duration]
min_time = 500
format = "took [$duration](bold #F78C6C) "

[time]
disabled = false
format = '🕐 [$time]($style) '
style = "bold #FFCB6B"
time_format = "%T"

[memory_usage]
symbol = "💡 "
format = "[$symbol$ram]($style) "
style = "bold #F78C6C"
threshold = 75
disabled = false

[jobs]
symbol = "⚙️ "
format = "[$symbol$number]($style) "
style = "bold #89DDFF"
number_threshold = 1
symbol_threshold = 1

[line_break]
disabled = false

[battery]
full_symbol = "🔋 "
charging_symbol = "⚡ "
discharging_symbol = "🔋 "
format = "[$symbol$percentage]($style) "
disabled = false

[[battery.display]]
threshold = 20
style = "bold #FF5370"

[[battery.display]]
threshold = 50
style = "bold #FFCB6B"

[[battery.display]]
threshold = 100
style = "bold #C3E88D"

[status]
style = "bold #FF5370"
symbol = "❌ "
format = "[$symbol$status]($style) "
disabled = false
